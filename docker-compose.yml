# Opcional: PostgreSQL local con Docker Desktop (puerto 5433 en el host para no chocar con otro Postgres en 5432). Alternativa sin Docker: una base gratuita en la nube.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: remotefit
      POSTGRES_PASSWORD: remotefit
      POSTGRES_DB: remotefit
    ports:
      - "5433:5432"
    volumes:
      - remotefit-db:/var/lib/postgresql/data
volumes:
  remotefit-db:
